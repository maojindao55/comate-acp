name: Publish Release & Sync npmmirror

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run adapter regression tests
        if: runner.os != 'Windows'
        run: npm test

      - name: Verify Windows npm launchers and MCP preload
        if: runner.os == 'Windows'
        run: node --test test/comate-executable.test.mjs

  create-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  sync-npmmirror:
    name: Sync to Domestic npmmirror
    runs-on: ubuntu-latest
    needs: [create-release, publish-npm]
    steps:
      - name: Trigger npmmirror sync
        run: |
          echo "Triggering npmmirror sync for comate-acp..."
          curl -s -X PUT https://registry-direct.npmmirror.com/comate-acp/sync || true
          echo "npmmirror sync triggered successfully!"
